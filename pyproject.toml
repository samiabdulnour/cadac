[project]
name = "cadac"
version = "0.0.1"
description = "Office standards for Archicad, kept as data, and the checks that hold a template and a model to them"
readme = "README.md"
requires-python = ">=3.11"
# PyYAML reads the standards and the briefs. Talking to Archicad is plain HTTP
# and JSON, which the standard library does.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
cadac = "cadac.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
